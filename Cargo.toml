[workspace]
resolver = "2"
members = [
    "crates/gradus",
    "crates/gradus-model",
    "crates/gradus-config",
    "crates/gradus-core",
    "crates/gradus-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/duskine/gradus"
authors = ["duskine"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

gradus-model = { path = "crates/gradus-model", version = "0.1.2" }
gradus-config = { path = "crates/gradus-config", version = "0.1.2" }
gradus-core = { path = "crates/gradus-core", version = "0.1.2" }
gradus = { path = "crates/gradus", version = "0.1.2" }