name: publish
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned toolchain
        run: rustup show
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gradus") | .version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not determine the Gradus workspace version" >&2
            exit 1
          fi

          publish_if_missing() {
            package="$1"
            url="https://crates.io/api/v1/crates/${package}/${version}"
            status=$(curl --silent --show-error --header 'User-Agent: Gradus-publish-workflow (https://github.com/duskine/gradus)' --output /dev/null --write-out '%{http_code}' "$url") || {
              echo "Could not check crates.io for ${package}@${version}; refusing to publish" >&2
              return 1
            }

            case "$status" in
              200)
                echo "${package}@${version} already published; skipping"
                ;;
              404)
                echo "Publishing ${package}@${version}"
                cargo publish -p "$package" --token "$CARGO_REGISTRY_TOKEN"
                ;;
              *)
                echo "Unexpected crates.io response ${status} for ${package}@${version}; refusing to publish" >&2
                return 1
                ;;
            esac
          }

          publish_if_missing gradus-model
          sleep 30
          publish_if_missing gradus-config
          publish_if_missing gradus-core
          sleep 30
          publish_if_missing gradus
          sleep 30
          publish_if_missing gradus-cli
